services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legalmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_mind_db
    ports:
      - "5433:5432"
    volumes:
      - legalmind-pgdata:/var/lib/postgresql/data

volumes:
  legalmind-pgdata:
